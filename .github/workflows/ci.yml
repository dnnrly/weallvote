name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22' # Use the latest Go version

    - name: Run Go tests
      run: cd backend && go test ./...

  frontend-tests:
    name: Frontend & Playwright Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Use the latest LTS Node.js version
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json # Adjust if using yarn or pnpm

    - name: Set up Go (needed to build and run backend for Playwright)
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build and Run Backend (for Playwright E2E)
      run: |
        cd backend
        make build
        PORT=8080 make run & # Run backend in background
        echo "Waiting for backend to start..."
        # Wait for the health check endpoint to be available
        timeout 60s bash -c 'until curl --output /dev/null --silent --head http://localhost:8080/healthz; do printf '\'' . '\''; sleep 1; done; echo ""'

    - name: Install Frontend Dependencies
      run: cd frontend && npm install

    - name: Build Frontend
      # Ensure this build command correctly processes Tailwind v4 via PostCSS
      run: cd frontend && npm run build

    - name: Run Frontend Unit Tests (if any)
      # Replace with your actual frontend test command if you have unit tests
      run: cd frontend && npm test:unit

    - name: Install Playwright Browsers
      run: cd frontend && npx playwright install --with-deps

    - name: Run Playwright E2E Tests
      # Set the base URL for Playwright tests to the locally running backend
      run: cd frontend && BASE_URL=http://localhost:8080 npx playwright test

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [go-tests, frontend-tests] # Ensure tests pass before deploying
    if: github.ref == 'refs/heads/main' # Deploy only on push to main branch

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Fly.io CLI
      uses: superfly/flyctl-actions/setup-flyctl@v1

    - name: Deploy to Fly.io
      run: flyctl deploy --remote-only
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # Add any other necessary secrets or environment variables for deployment
        # DATABASE_URL: ${{ secrets.DATABASE_URL }} # Example for external DB

